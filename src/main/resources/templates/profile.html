<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Профиль - Сеть решений</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
    <style>
      /* Header с навигацией */
      .header1 {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 0;
        margin-bottom: 40px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .profile-wrapper {
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 30px;
      }

      /* Боковая панель */
      .sidebar {
        height: fit-content;
        position: sticky;
        top: 20px;
      }

      .profile-card {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 30px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        text-align: center;
        margin-bottom: 30px;
      }

      .avatar {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        margin: 0 auto 20px;
        background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3rem;
        box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
      }

      .user-name {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 5px;
      }

      .user-email {
        font-size: 0.9rem;
        color: #e0e7ff;
        margin-bottom: 20px;
      }

      .user-stats {
        display: grid;

        gap: 10px;
        margin-bottom: 20px;
      }

      .stat-item {
        background: rgba(255, 255, 255, 0.05);
        padding: 15px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .stat-number {
        font-size: 1.5rem;
        font-weight: 700;
        color: #fffff;
      }

      .stat-name {
        font-size: 0.75rem;
        color: #fffff;
        text-transform: uppercase;
        margin-top: 5px;
      }

      .logout-btn {
        width: 100%;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: #fff;
        padding: 12px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
        margin-top: 10px;
      }

      .logout-btn:hover {
        background: rgba(255, 255, 255, 0.2);
        border-color: #ef4444;
        color: #ef4444;
      }

      /* Основной контент */
      .main-content {
        display: flex;
        flex-direction: column;
        gap: 30px;
      }

      .section-title {
        font-size: 1.8rem;
        font-weight: 700;
        margin-bottom: 20px;
      }

      /* Карточки результатов */
      .results-section {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 30px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }

      .results-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
      }

      .result-card {
        background: rgba(255, 255, 255, 0.05);
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        padding: 20px;
        transition: all 0.3s ease;
      }

      .result-card:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: #8b5cf6;
        transform: translateY(-5px);
      }

      .result-date {
        color: #a78bfa;
        font-size: 0.85rem;
        margin-bottom: 10px;
      }

      .result-profile-name {
        font-size: 1.3rem;
        font-weight: 700;
        margin-bottom: 10px;
      }

      .result-questions {
        color: #e0e7ff;
        font-size: 0.9rem;
        margin-bottom: 15px;
      }

      .result-accuracy {
        display: inline-block;
        background: rgba(139, 92, 246, 0.2);
        color: #a78bfa;
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 600;
      }

      .no-results {
        grid-column: 1 / -1;
        text-align: center;
        padding: 40px;
        color: #a78bfa;
        font-size: 1.1rem;
      }

      .no-results-icon {
        font-size: 4rem;
        margin-bottom: 20px;
      }

      /* График статистики */
      .stats-chart {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 15px;
        padding: 20px;
        margin-top: 30px;
      }

      .chart-bar {
        display: flex;
        align-items: center;
        margin-bottom: 15px;
      }

      .chart-label {
        width: 150px;
        color: #e0e7ff;
        font-size: 0.9rem;
      }

      .chart-bar-container {
        flex: 1;
        height: 30px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
        overflow: hidden;
        margin: 0 15px;
      }

      .chart-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #8b5cf6 0%, #6366f1 100%);
        border-radius: 10px;
        transition: width 0.5s ease;
      }

      .chart-value {
        width: 50px;
        text-align: right;
        color: #fffff;
        font-weight: 700;
        font-size: 1rem;
      }

      @media (max-width: 768px) {
        .profile-wrapper {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
        }

        .results-grid {
          grid-template-columns: 1fr;
        }

        .header1 {
          flex-direction: column;
          gap: 15px;
        }

        .nav-buttons {
          width: 100%;
          justify-content: space-between;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-animation">
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
    </div>

    <div class="container">
      <!-- заголовок с навигацией -->
      <header class="header1">
        <h1 class="logo1">⚖️ Сеть решений</h1>
        <div class="nav-buttons">
          <button
            class="nav-btn active"
            onclick="window.location.href='/profile'"
          >
            Профиль
          </button>
          <button class="nav-btn" onclick="window.location.href='/'">
            Тестирование
          </button>
          <button class="nav-btn" onclick="logout()">Выход</button>
        </div>
      </header>

      <!-- основной профиль -->
      <div class="profile-wrapper">
        <!-- боковая панель с информацией -->
        <aside class="sidebar">
          <div class="profile-card">
            <div class="avatar">👤</div>
            <h2 class="user-name" th:text="${userName}">Имя пользователя</h2>
            <p class="user-email" th:text="${userEmail}">email@example.com</p>

            <div class="user-stats">
              <div class="stat-item">
                <div class="stat-number" th:text="${totalTests}">0</div>
                <div class="stat-name">Тестов</div>
              </div>
            </div>

            <button class="logout-btn" onclick="logout()">Выйти</button>
          </div>
        </aside>

        <!-- основной контент -->
        <main class="main-content">
          <!-- статистика результатов -->
          <section class="results-section">
            <h3 class="section-title">Последние результаты</h3>

            <div class="results-grid">
              <div class="no-results" th:if="${recentResults.isEmpty()}">
                <div class="no-results-icon">📝</div>
                <div>Вы еще не прошли ни одного теста</div>
                <a
                  href="/"
                  class="nav-btn active"
                  style="
                    display: inline-block;
                    margin-top: 20px;
                    text-decoration: none;
                  "
                  >Пройти тест</a
                >
              </div>

              <div th:each="result : ${recentResults}" class="result-card">
                <div
                  class="result-date"
                  th:text="${#temporals.format(result.completedAt, 'dd.MM.yyyy HH:mm')}"
                >
                  25.10.2025
                </div>
                <div
                  class="result-profile-name"
                  th:text="${result.personalityType}"
                >
                  Альтруист
                </div>
                <div class="result-questions">
                  <span th:text="${result.questionsCount}">0</span> вопросов
                </div>
                <span
                  class="result-accuracy"
                  th:if="${result.questionsCount >= 80}"
                  >Очень высокая</span
                >
                <span
                  class="result-accuracy"
                  th:if="${result.questionsCount >= 50 and result.questionsCount < 80}"
                  >Высокая точность</span
                >
                <span
                  class="result-accuracy"
                  th:if="${result.questionsCount >= 25 and result.questionsCount < 50}"
                  >Средняя точность</span
                >
                <span
                  class="result-accuracy"
                  th:if="${result.questionsCount < 25}"
                  >Базовая</span
                >
              </div>
            </div>

            <!-- График характеристик -->
            <div class="stats-chart" th:if="${!averageStats.isEmpty()}">
              <h4 style="margin-bottom: 20px; color: #e0e7ff">
                Средние показатели за все тесты
              </h4>

              <div class="chart-bar" th:each="stat : ${averageStats}">
                <div class="chart-label" th:text="${stat.label}">Альтруизм</div>
                <div class="chart-bar-container">
                  <div
                    class="chart-bar-fill"
                    th:style="${'width: ' + stat.value + '%'}"
                  ></div>
                </div>
                <div class="chart-value" th:text="${stat.value + '%'}">78%</div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script th:src="@{/profile.js}"></script>
  </body>
</html>
